name: Validate reviewed release identity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-release-identity:
    name: validate-release-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind package, release tag and source main at the exact reviewed head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/validate_release.py origin/main reviewed-release.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reviewed-release-${{ github.event.pull_request.head.sha }}
          path: reviewed-release.json
          if-no-files-found: error
          retention-days: 1
  merge-window:
    name: merge-window
    needs: validate-release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve the post-review branch-movement window
        run: sleep 480
